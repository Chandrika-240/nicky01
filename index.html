<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Secret Surprise ❤️</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    overflow:hidden;
    background:linear-gradient(135deg,#3a0a5a,#7b2cbf,#ff5ea8);
}

.container{
    width:380px;
    padding:30px;
    text-align:center;
    background:rgba(255,255,255,0.15);
    backdrop-filter:blur(15px);
    border-radius:25px;
    box-shadow:0 10px 30px rgba(0,0,0,0.3);
    color:white;
}

.kiss{
    width:180px;
    border-radius:20px;
    margin-bottom:15px;
}

h1{
    margin-bottom:10px;
}

p{
    color:#ffe6f2;
    margin-bottom:20px;
}

input{
    width:100%;
    padding:14px;
    border:none;
    border-radius:30px;
    outline:none;
    text-align:center;
    font-size:17px;
}

button{
    width:100%;
    margin-top:18px;
    padding:14px;
    border:none;
    border-radius:30px;
    background:#ff4d8d;
    color:white;
    font-size:18px;
    cursor:pointer;
    animation:beat 1.5s infinite;
}

button:hover{
    background:#ff2f79;
}

#msg{
    margin-top:15px;
    color:#fff;
    font-weight:bold;
}

@keyframes beat{
    0%,100%{transform:scale(1);}
    50%{transform:scale(1.06);}
}

/* Floating Hearts */
.heart{
    position:fixed;
    bottom:-30px;
    font-size:22px;
    animation:float 6s linear forwards;
    pointer-events:none;
}

@keyframes float{
    from{
        transform:translateY(0);
        opacity:1;
    }
    to{
        transform:translateY(-120vh);
        opacity:0;
    }
}
</style>
</head>

<body>

<div class="container">

<img src="cartoon.png" class="kiss" alt="Cute Couple">

<h1>🔒 Only For My Love ❤️</h1>

<p>Enter our secret name to unlock my heart 💖</p>

<input
type="password"
id="password"
placeholder="Our Secret Name">

<button onclick="checkPassword()">
Unlock My Heart ❤️
</button>

<p id="msg"></p>

</div>

<script>

function checkPassword(){

    const password = "nylaa";

    const input = document.getElementById("password").value.toLowerCase();

    if(input === password){

        window.location.href = "birthdayy.html";

    }else{

        document.getElementById("msg").innerHTML =
        "💖 Oops... That's not our secret name.";

    }

}

// Floating Hearts Animation
setInterval(function(){

    const heart = document.createElement("div");

    heart.className = "heart";

    heart.innerHTML = "💖";

    heart.style.left = Math.random()*100 + "vw";

    heart.style.fontSize = (20 + Math.random()*25) + "px";

    heart.style.animationDuration = (4 + Math.random()*3) + "s";

    document.body.appendChild(heart);

    setTimeout(function(){
        heart.remove();
    },7000);

},300);

</script>

</body>
</html>
